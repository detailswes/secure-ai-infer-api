version: '3.8'

services:
  secure-ai-infer-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secure-ai-infer-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
